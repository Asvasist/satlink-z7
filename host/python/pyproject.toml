[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "satlink"
version = "0.6.0"
description = "SatLink-Z7 ground segment in Python: PUS client and SCPI instrument driver"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
visa = ["pyvisa>=1.12", "pyvisa-py>=0.7"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["satlink"]
