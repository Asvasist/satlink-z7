# SatLink-Z7 kernel options (merged on top of xilinx_zynq_defconfig).
# @implements SRS-BSP-002

# Board peripherals
CONFIG_SPI_CADENCE=y
CONFIG_I2C_CADENCE=y
CONFIG_I2C_CHARDEV=y
CONFIG_CAN=y
CONFIG_CAN_MCP251X=m
CONFIG_XILINX_DMA=y
CONFIG_UIO=y
CONFIG_UIO_PDRV_GENIRQ=m
CONFIG_WATCHDOG=y
CONFIG_CADENCE_WATCHDOG=y

# Networking for the payload link (TUN/GSE in Stage 5)
CONFIG_TUN=y

# AMP groundwork (Stage 4)
CONFIG_REMOTEPROC=y
CONFIG_RPMSG_CHAR=y
CONFIG_RPMSG_VIRTIO=y

# Debugging and diagnostics
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y
CONFIG_DYNAMIC_DEBUG=y
CONFIG_FTRACE=y
CONFIG_FUNCTION_TRACER=y
