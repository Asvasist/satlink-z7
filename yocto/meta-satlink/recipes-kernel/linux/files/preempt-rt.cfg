# Fully preemptible kernel. Selected with SATLINK_RT = "1".
# On 32-bit ARM this needs a kernel that supports PREEMPT_RT for ARM (mainline or the RT
# patch set); otherwise the kernel build warns that the option was not applied.
# @implements SRS-BSP-002
CONFIG_EXPERT=y
CONFIG_PREEMPT_RT=y
CONFIG_HIGH_RES_TIMERS=y
CONFIG_NO_HZ_FULL=y
