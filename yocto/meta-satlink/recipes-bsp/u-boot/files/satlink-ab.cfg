# Secure A/B boot (SATLINK_SECURE_BOOT = "1", Stage 3).
# @implements SRS-BOOT-002
# @implements SRS-BOOT-003

# Environment: default from satlink-env.txt, persistent copy in uboot.env on the FAT partition.
CONFIG_USE_DEFAULT_ENV_FILE=y
CONFIG_DEFAULT_ENV_FILE="satlink-env.txt"
CONFIG_ENV_IS_NOWHERE=n
CONFIG_ENV_IS_IN_FAT=y
CONFIG_ENV_FAT_INTERFACE="mmc"
CONFIG_ENV_FAT_DEVICE_AND_PART="0:1"
CONFIG_ENV_FAT_FILE="uboot.env"
CONFIG_ENV_SIZE=0x20000

# Only these variables are taken from uboot.env; everything else (bootcmd, altbootcmd, ...)
# always comes from the built-in default, so the FAT copy cannot redirect the boot.
CONFIG_ENV_WRITEABLE_LIST=y
CONFIG_ENV_FLAGS_LIST_STATIC="boot_slot:sw,bootcount:dw,upgrade_available:dw,rollback:dw,ethaddr:mw"

# Boot counting: bootcount lives in the environment, altbootcmd runs above bootlimit.
CONFIG_BOOTCOUNT_LIMIT=y
CONFIG_BOOTCOUNT_ENV=y

# Only signed FIT images boot: no legacy uImage, no raw zImage.
CONFIG_FIT_SIGNATURE=y
CONFIG_RSA=y
CONFIG_LEGACY_IMAGE_FORMAT=n
CONFIG_CMD_BOOTZ=n
