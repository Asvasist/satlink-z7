# Extra U-Boot options for the A/B boot flow (SATLINK_AB=1), merged after satlink-uboot.cfg.
# The slot state lives in the environment file uboot.env on the FAT boot partition, which
# satlink-bootctl reads and writes from Linux through libubootenv (etc/fw_env.config).
# @implements SRS-BOOT-003
# CONFIG_ENV_IS_NOWHERE is not set
CONFIG_ENV_IS_IN_FAT=y
CONFIG_ENV_FAT_INTERFACE="mmc"
CONFIG_ENV_FAT_DEVICE_AND_PART="0:1"
CONFIG_ENV_FAT_FILE="uboot.env"
CONFIG_ENV_SIZE=0x4000
CONFIG_CMD_FAT=y
CONFIG_CMD_SETEXPR=y
CONFIG_CMD_SAVEENV=y
