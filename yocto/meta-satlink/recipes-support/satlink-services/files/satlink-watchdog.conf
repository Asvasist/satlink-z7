# systemd feeds the Zynq system watchdog (SWDT, cdns,wdt-r1p2): if PID 1 or the kernel hangs
# for 30 s the SoC is reset, U-Boot counts the boot attempt and, after bootlimit failures of a
# trial slot, boots the other slot (docs/fdir).
# @implements SRS-FDIR-001
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=2min
