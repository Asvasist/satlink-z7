#@TYPE: Machine
#@NAME: Digilent Zybo Z7-20 (SatLink-Z7)
#@DESCRIPTION: Zynq-7020 (dual Cortex-A9). By default the mainline PS-only device tree
#@DESCRIPTION: zynq-zybo-z7.dts; SATLINK_PL_DT=1 selects the board tree with the PL nodes.
# @implements SRS-BSP-001

# SoC defaults from meta-xilinx-core when available ('include' is silently skipped otherwise).
include conf/machine/include/soc-zynq.inc
require conf/machine/include/arm/armv7a/tune-cortexa9.inc
DEFAULTTUNE = "cortexa9thf-neon"
MACHINEOVERRIDES =. "zynq:"

MACHINE_FEATURES = "ext2 vfat usbhost ethernet serial rtc"

# Kernel: AMD linux-xlnx (needed for Zynq remoteproc in Stage 4).
PREFERRED_PROVIDER_virtual/kernel = "linux-xlnx"
KERNEL_IMAGETYPE = "zImage"
# SATLINK_PL_DT=1 boots the device tree that describes the PL blocks (linux/dts). It needs a
# bitstream that contains them (hw-v1 or later): reading an absent PL block stalls the bus.
SATLINK_PL_DT ?= "0"
SATLINK_DTB = "${@'zynq-zybo-z7-satlink.dtb' if d.getVar('SATLINK_PL_DT') == '1' else 'zynq-zybo-z7.dtb'}"
KERNEL_DEVICETREE = "xilinx/${SATLINK_DTB}"
SERIAL_CONSOLES = "115200;ttyPS0"

# Bootloader: AMD u-boot-xlnx. FSBL + bitstream come from Vivado/Vitis (see yocto/bootbin).
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-xlnx"
PREFERRED_PROVIDER_u-boot = "u-boot-xlnx"
UBOOT_MACHINE = "xilinx_zynq_virt_defconfig"
UBOOT_ELF = "u-boot.elf"

EXTRA_IMAGEDEPENDS += "virtual/bootloader satlink-boot-scr"

# SD card: FAT boot partition + ext4 root file system.
IMAGE_FSTYPES = "wic wic.bmap tar.gz"
WKS_FILE = "satlink-sd.wks"
# Whichever device tree was built is copied to the fixed name boot.scr loads.
IMAGE_BOOT_FILES = "zImage ${SATLINK_DTB};system.dtb boot.scr"
