#@TYPE: Machine
#@NAME: Digilent Zybo Z7-20 (SatLink-Z7)
#@DESCRIPTION: Zynq-7020 (dual Cortex-A9). By default the PS-only board tree with the AMP
#@DESCRIPTION: partitioning; SATLINK_PL_DT=1 adds the PL nodes.
# @implements SRS-BSP-001

# SoC defaults from meta-xilinx-core when available ('include' is silently skipped otherwise).
include conf/machine/include/soc-zynq.inc
require conf/machine/include/arm/armv7a/tune-cortexa9.inc
DEFAULTTUNE = "cortexa9thf-neon"
MACHINEOVERRIDES =. "zynq:"

MACHINE_FEATURES = "ext2 vfat usbhost ethernet serial rtc"

# Kernel: AMD linux-xlnx (Xilinx DMA engine, Zynq platform support).
PREFERRED_PROVIDER_virtual/kernel = "linux-xlnx"
KERNEL_IMAGETYPE = "zImage"
# SATLINK_PL_DT=1 boots the device tree that describes the PL blocks (linux/dts). It needs a
# bitstream that contains them (hw-v1 or later): reading an absent PL block stalls the bus.
SATLINK_PL_DT ?= "0"
SATLINK_DTB = "${@'zynq-zybo-z7-satlink.dtb' if d.getVar('SATLINK_PL_DT') == '1' else 'zynq-zybo-z7-satlink-amp.dtb'}"
KERNEL_DEVICETREE = "xilinx/${SATLINK_DTB}"
SERIAL_CONSOLES = "115200;ttyPS0"

# Bootloader: AMD u-boot-xlnx. FSBL + bitstream come from Vivado/Vitis (see yocto/bootbin).
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-xlnx"
PREFERRED_PROVIDER_u-boot = "u-boot-xlnx"
UBOOT_MACHINE = "xilinx_zynq_virt_defconfig"
UBOOT_ELF = "u-boot.elf"

# Secure A/B boot (Stage 3, default). "0" gives the Stage 1 layout: zImage + boot.scr on FAT.
SATLINK_SECURE_BOOT ?= "1"

# Kernel and device tree as one FIT image, signed with the key whose public half is built into
# U-Boot's device tree (uboot-sign.bbclass). FIT_GENERATE_KEYS creates a development key in
# UBOOT_SIGN_KEYDIR on the first build; a flight-like setup keeps the key off the build host.
KERNEL_CLASSES += "${@'kernel-fitimage' if d.getVar('SATLINK_SECURE_BOOT') == '1' else ''}"
KERNEL_IMAGETYPE = "${@'fitImage' if d.getVar('SATLINK_SECURE_BOOT') == '1' else 'zImage'}"
UBOOT_SIGN_ENABLE = "${@'1' if d.getVar('SATLINK_SECURE_BOOT') == '1' else '0'}"
UBOOT_SIGN_KEYNAME = "satlink-dev"
UBOOT_SIGN_KEYDIR ?= "${TOPDIR}/satlink-keys"
FIT_GENERATE_KEYS = "1"
FIT_HASH_ALG = "sha256"
FIT_SIGN_ALG = "rsa"
FIT_SIGN_NUMBITS = "2048"
UBOOT_MKIMAGE_DTCOPTS = "-I dts -O dtb -p 2000"
UBOOT_LOADADDRESS = "0x00008000"
UBOOT_ENTRYPOINT = "0x00008000"

EXTRA_IMAGEDEPENDS += "virtual/bootloader ${@'' if d.getVar('SATLINK_SECURE_BOOT') == '1' else 'satlink-boot-scr'}"

IMAGE_FSTYPES = "wic wic.bmap tar.gz ext4"
WKS_FILE = "${@'satlink-sd-ab.wks' if d.getVar('SATLINK_SECURE_BOOT') == '1' else 'satlink-sd.wks'}"
# Stage 1: kernel, device tree (fixed name that boot.scr loads) and boot script on FAT.
# A/B: the kernel FIT is in each root file system; the FAT partition only holds BOOT.BIN and
# uboot.env, both written outside the image (see yocto/bootbin).
IMAGE_BOOT_FILES = "${@'' if d.getVar('SATLINK_SECURE_BOOT') == '1' else 'zImage ${SATLINK_DTB};system.dtb boot.scr'}"
