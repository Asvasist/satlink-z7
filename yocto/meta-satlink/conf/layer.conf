# meta-satlink: BSP and image layer for SatLink-Z7 on the Zybo Z7-20.
# @implements SRS-BSP-001
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "satlink"
BBFILE_PATTERN_satlink = "^${LAYERDIR}/"
BBFILE_PRIORITY_satlink = "10"

LAYERVERSION_satlink = "1"
LAYERDEPENDS_satlink = "core openembedded-layer"
LAYERSERIES_COMPAT_satlink = "scarthgap"
