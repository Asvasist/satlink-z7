# SatLink-Z7 continuous integration: runs on every push and pull request.
# @implements SRS-BLD-003
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: |
          git ls-files '*.c' '*.h' '*.cpp' '*.hpp' ':!:libs/regs/include/satlink/regs/*' \
            | xargs --no-run-if-empty clang-format --dry-run --Werror

  host-tests:
    name: host unit tests + coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcovr
      - name: Configure
        run: cmake --preset host-coverage
      - name: Build
        run: cmake --build --preset host-coverage
      - name: Test
        run: ctest --preset host-coverage
      # @implements SRS-BLD-005
      - name: Coverage (libs >= 80 % lines)
        run: |
          mkdir -p coverage
          gcovr --root . --filter 'libs/' --print-summary --fail-under-line 80 \
                --xml-pretty -o coverage/coverage.xml --html-details coverage/index.html \
                build/host-coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

  sanitizers:
    name: host unit tests (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset host-asan
      - run: cmake --build --preset host-asan
      - run: ctest --preset host-asan

  static-analysis:
    name: clang-tidy + cppcheck + MISRA report
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang clang-tidy cppcheck
      - name: Build with clang-tidy
        run: |
          cmake --preset host-tidy
          cmake --build --preset host-tidy
      - name: cppcheck (blocking)
        run: |
          cppcheck --project=build/host-tidy/compile_commands.json \
                   --file-filter='libs/*' \
                   --enable=warning,style,performance,portability \
                   --inline-suppr --suppress=missingIncludeSystem \
                   --error-exitcode=1
      - name: MISRA C:2012 report (non-blocking, deviations tracked)
        continue-on-error: true
        run: |
          cppcheck --project=build/host-tidy/compile_commands.json \
                   --file-filter='libs/common/*' --addon=misra \
                   --suppress=missingIncludeSystem \
                   --output-file=misra-report.txt
          cat misra-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: misra-report
          path: misra-report.txt
          if-no-files-found: ignore

  cross-build:
    name: cross build (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-arm
            packages: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
          - preset: rtos-a9
            packages: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - preset: hkc-riscv
            packages: gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.packages }}
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - name: Upload firmware images
        if: matrix.preset != 'linux-arm'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/firmware/**/*.elf
            build/${{ matrix.preset }}/firmware/**/*.bin
            build/${{ matrix.preset }}/firmware/**/*.slhk
            build/${{ matrix.preset }}/firmware/**/*.map
          if-no-files-found: ignore

  rtos-qemu:
    name: Core 1 firmware self-test in QEMU
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm
      - run: cmake --preset rtos-a9
      - run: cmake --build --preset rtos-a9
      # @implements SRS-BLD-003
      - name: Boot FreeRTOS on the emulated Zynq and run the modem self-test
        run: python3 tools/rtos/qemu_selftest.py build/rtos-a9/firmware/rtos/satlink_rtos.elf --timeout 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtos-qemu-log
          path: build/rtos-a9/firmware/rtos/qemu-selftest.log
          if-no-files-found: ignore

  kernel:
    name: kernel modules + device trees (linux-xlnx 6.6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf flex bison bc libssl-dev libelf-dev
      - name: Fetch and prepare the kernel (xilinx_zynq_defconfig)
        run: |
          git clone --depth 1 -b xlnx_rebase_v6.6_LTS https://github.com/Xilinx/linux-xlnx.git "$RUNNER_TEMP/linux"
          cd "$RUNNER_TEMP/linux"
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- xilinx_zynq_defconfig
          ./scripts/config --enable CONFIG_CAN --module CONFIG_CAN_MCP251X --enable CONFIG_XILINX_DMA \
                           --enable CONFIG_HOTPLUG_CPU --enable CONFIG_MFD_SYSCON
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- olddefconfig modules_prepare -j"$(nproc)"
      # Compile-only (no Module.symvers without a full kernel build): warnings are errors.
      - name: Build the out-of-tree modules
        run: |
          for d in ccsds_frame_accel spec_tap satlink_amp; do
            make -C linux/drivers/$d KERNEL_SRC="$RUNNER_TEMP/linux" ARCH=arm \
                 CROSS_COMPILE=arm-linux-gnueabihf- W=1 KBUILD_MODPOST_WARN=1 \
                 KCFLAGS=-Werror
          done
      - name: Build the board device trees
        run: |
          dts="$RUNNER_TEMP/linux/arch/arm/boot/dts/xilinx"
          cp linux/dts/*.dts linux/dts/*.dtsi "$dts/"
          for t in zynq-zybo-z7-satlink-amp zynq-zybo-z7-satlink; do
            echo "dtb-\$(CONFIG_ARCH_ZYNQ) += $t.dtb" >> "$dts/Makefile"
            make -C "$RUNNER_TEMP/linux" ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- W=1 xilinx/$t.dtb
          done

  python-tools:
    name: ICD + traceability checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tools/requirements.txt
      - name: Tool unit tests
        run: python -m pytest tools -q
      - name: Generated register headers and ICD pages are up to date
        run: python tools/regmap/regmap_gen.py --check
      - name: Traceability matrix is up to date and all tags are valid
        run: python tools/trace/trace_matrix.py --check

  requirements-doc:
    name: SRS export (StrictDoc)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r docs/requirements/requirements.txt
      - name: Export HTML
        run: strictdoc export docs/requirements --output-dir build/srs
      - name: Export ReqIF (DOORS-importable)
        continue-on-error: true
        run: strictdoc export docs/requirements --formats reqif-sdoc --output-dir build/srs-reqif
      - uses: actions/upload-artifact@v4
        with:
          name: srs
          path: build/srs*

  ground-station:
    name: ground station (Qt 6, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build qt6-base-dev qt6-charts-dev
      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          modules: qtcharts
      - name: Build
        shell: bash
        run: |
          extra=""
          if [ "$RUNNER_OS" = "Linux" ]; then extra="-G Ninja -DSATLINK_GS_WERROR=ON"; fi
          cmake -S host/gs -B build/gs -DCMAKE_BUILD_TYPE=Release $extra
          cmake --build build/gs --config Release
      # @verifies SRS-GS-002
      - name: Headless run against the simulated payload (screenshot)
        if: runner.os == 'Linux'
        run: |
          cmake --preset host-release && cmake --build --preset host-release --target satlink-payloadd
          build/host-release/linux/payload/satlink-payloadd --sim --scpi-port 0 &
          QT_QPA_PLATFORM=offscreen build/gs/satlink-gs --pass --screenshot gs.png --after 30
          kill %1
          test -s gs.png
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: ground-station-screenshot
          path: gs.png

  rust-cli:
    name: Rust CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        working-directory: host/cli
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release

  hil-sim:
    name: HIL tests against the simulated payload (pytest + pyVISA)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          python -m pip install -r host/hil/requirements.txt
      - name: Build the payload daemon
        run: cmake --preset host-release && cmake --build --preset host-release --target satlink-payloadd
      - name: Python client tests
        run: python -m pytest host/python/tests -q
      - name: HIL suite (--target sim)
        run: >
          python -m pytest host/hil --target sim
          --payloadd build/host-release/linux/payload/satlink-payloadd
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hil-payloadd-log
          path: build/hil-payloadd.log

  performance:
    name: link performance sweep
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          python -m pip install matplotlib
      - run: cmake --preset host-release && cmake --build --preset host-release --target satlink-modem-perf
      - name: Sweep (500 frames per point)
        run: build/host-release/tools/perf/satlink-modem-perf --frames 500 > modem_perf.csv
      # @verifies SRS-PERF-001
      - name: Every ACM threshold is at or above the measured 1 % FER point
        run: python tools/perf/plot_perf.py modem_perf.csv --out performance --check
      - uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: |
            modem_perf.csv
            performance/

